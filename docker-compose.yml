services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: resonance
      POSTGRES_DB: resonance
    ports:
      - "5432:5432"
    volumes:
      - resonance_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      # Inside the compose network the bundled postgres is reachable at the "db" service name
      # (overrides .env's localhost URL). Using an external database instead? Remove this line
      # and set DATABASE_URL in .env.
      DATABASE_URL: postgresql://resonance:resonance@db:5432/resonance
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped
    # No command override: the image's production CMD applies migrations, then runs the
    # compiled server (node dist/main.js).

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      # Inside the compose network the API is reachable at the "api" service name, not
      # localhost. This is what the web server uses to proxy /api/v1/* — getting it wrong
      # yields 502s on every API call.
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped
    # No command override: the image runs `next start` on the production build (never
    # `next dev` — a dev server behind a reverse proxy fails to hydrate and renders blank).

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      RESONANCE_API_URL: http://api:3001
    depends_on:
      - api
    ports:
      - "3002:3002"
    restart: unless-stopped

volumes:
  resonance_db:
